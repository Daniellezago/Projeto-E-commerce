<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Reserva - Hotel Exemplo (estilizado)</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Reserva de hospedagem</h1>
		<h1 style="color: green">Reserva de hospedagem com CSS INLINE</h1>
		<h1> Reserva de hospedagem:</h
        <p>Mesmo formulário da Aula 3 — agora com CSS aplicado (seletor de elemento, de classe e de id).</p>

        <form action="/reservas" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required minlength="3">
                <br><br>

                <label>Sexo:</label>
                <input type="radio" id="sexo-f" name="sexo" value="feminino">
                <label for="sexo-f">Feminino</label>
                <input type="radio" id="sexo-m" name="sexo" value="masculino">
                <label for="sexo-m">Masculino</label>
                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </fieldset>

            <fieldset>
                <legend>Dados da reserva</legend>

                <label for="chegada">Data de chegada:</label>
                <input type="date" id="chegada" name="chegada" required>
                <br><br>

                <label for="noites">Número de noites:</label>
                <input type="number" id="noites" name="noites" min="1" max="30" value="1" required>
                <br><br>

                <label for="hospedes">Número de hóspedes:</label>
                <select id="hospedes" name="hospedes">
                    <option value="1">1 hóspede</option>
                    <option value="2" selected>2 hóspedes</option>
                    <option value="3">3 hóspedes</option>
                    <option value="4">4 hóspedes</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Resumo e observações</legend>

                <label for="total">Total estimado (R$):</label>
                <output id="total" name="total" for="noites hospedes">R$ 0,00</output>
                <br><br>

                <label for="mensagem">Mensagem (opcional):</label>
                <br>
                <textarea id="mensagem" name="mensagem" rows="4" cols="40"
                          placeholder="Alguma preferência ou observação?"></textarea>
                <br><br>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Quero receber promoções por e-mail</label>
            </fieldset>

            <button type="submit" class="botao-principal" style="background-color:lightyellow;">Confirmar reserva</button>
            <button type="reset" class="botao-secundario">Limpar formulário</button>

        </form>
    </body>
</html>
